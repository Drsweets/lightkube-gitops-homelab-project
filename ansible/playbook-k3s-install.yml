---
- name: Bootstrap single-node K3s Ubuntu host
  hosts: cluster_nodes
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - name: Install system dependencies
      apt:
        name:
          - curl
          - gnupg
          - lsb-release
        update_cache: yes

    - name: Ensure /etc/rancher/k3s directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Configure containerd registry mirror
      copy:
        dest: /etc/rancher/k3s/registries.yaml
        content: |
          mirrors:
            docker.io:
              endpoint:
                - "{{ containerd_mirror_endpoint }}"
        mode: '0644'
      when: containerd_mirror | bool

    - name: Install K3s Server
      shell: |
        curl -sfL "{{ k3s_install_url_china if (containerd_mirror | bool) else k3s_install_url }}" |
        INSTALL_K3S_VERSION={{ k3s_version }} \
        INSTALL_K3S_EXEC="server {{ k3s_server_args }}" \
        sh -
      args:
        executable: /bin/bash

    - name: Ensure .kube directory exists
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy kubeconfig to regular user home directory
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Fetch kubeconfig file to local workstation
      fetch:
        src: "/home/{{ ansible_user }}/.kube/config"
        dest: "./kubeconfig"
        flat: yes
